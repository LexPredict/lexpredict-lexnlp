[build-system]
requires = ["setuptools==84.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lexnlp"
version = "2.3.0"
description = "LexPredict LexNLP"
readme = { file = "README.rst", content-type = "text/x-rst" }
requires-python = ">=3.10,<3.14"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
  { name = "ContraxSuite, LLC", email = "support@contraxsuite.com" }
]
keywords = [
  "legal",
  "contract",
  "document analytics",
  "nlp",
  "ml",
  "machine learning",
  "natural language"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Information Technology",
  "Intended Audience :: Legal Industry",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Topic :: Office/Business",
  "Topic :: Text Processing :: Linguistic",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13"
]

dependencies = [
  "beautifulsoup4>=4.11.1,<5",
  "cloudpickle>=2.2.0,<4",
  "dateparser>=1.4.3,<2",
  "elasticsearch>=8.17.0,<10",
  "gensim>=4.3.3,<5",
  "joblib>=1.5.0,<2",
  "lxml>=6.1.3,<7",
  "nltk>=3.10.3,<4",
  "num2words>=0.5.12,<1",
  "numpy>=1.26.4,<3",
  "pandas>=2.2.0,<4",
  "psutil>=6.0.0,<8",
  "pycountry>=24.6.1,<27",
  "python-dateutil>=2.8.2,<3",
  "regex>=2026.7.19,<2027",
  "reporters-db>=3.2.32,<4",
  "requests>=2.34.2,<3",
  "scikit-learn==1.7.2",
  "scipy>=1.13.0,<2",
  "threadpoolctl>=3.1.0,<4",
  "tqdm>=4.64.1,<5",
  "Unidecode>=1.3.6,<2",
  "us>=3.2.0,<4",
  "zahlwort2num>=0.4.2,<1"
]

[project.urls]
Homepage = "https://github.com/LexPredict/lexpredict-lexnlp"
Documentation = "https://lexpredict-lexnlp.readthedocs.io/"
Repository = "https://github.com/LexPredict/lexpredict-lexnlp"
Issues = "https://github.com/LexPredict/lexpredict-lexnlp/issues"

[project.optional-dependencies]
dev = [
  "build>=1.2.2",
  "memory-profiler>=0.61.0",
  "pylint>=3.3.0",
  "pytest>=8.3.0",
  "pytest-cov>=5.0.0",
  "pytest-xdist>=3.6.0",
  "ruff>=0.16,<0.17",
  "sphinx>=7.4,<10",
  "sphinx-rtd-theme>=3,<4",
  "twine>=5.1.1"
]
docs = [
  "sphinx>=7.4,<10",
  "sphinx-rtd-theme>=3,<4"
]
test = [
  "memory-profiler>=0.61.0",
  "pytest>=8.3.0",
  "pytest-cov>=5.0.0",
  "pytest-xdist>=3.6.0"
]
stanford = []
tika = ["tika>=3.1.0,<4"]
audit = [
  "pip-audit>=2.9.0,<3"
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["lexnlp*"]
exclude = ["*tests*"]
namespaces = false

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.pytest.ini_options]
markers = [
  "serial: sequential-only tests"
]
